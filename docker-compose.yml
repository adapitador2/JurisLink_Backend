name: jurislink

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-jurislink}
      MYSQL_USER: ${DB_USER:-jurislink_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-jurislink_app}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      DB_NAME: ${DB_NAME:-jurislink}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?Defina ACCESS_TOKEN_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?Defina CORS_ORIGINS}
      TZ: America/Sao_Paulo
    expose:
      - "8000"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  mysql_data:
  uploads_data:
