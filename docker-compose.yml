name: jurislink

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST:?Defina DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-jurislink_app}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      DB_NAME: ${DB_NAME:-jurislink}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?Defina ACCESS_TOKEN_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?Defina CORS_ORIGINS}
      TZ: America/Sao_Paulo
    expose:
      - "8000"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  uploads_data:
